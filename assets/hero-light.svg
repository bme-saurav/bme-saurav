<text x="66" y="38" font-size="15" fill="#5b6576" font-weight="600" class="mono" letter-spacing="1.5">BME-SAURAV / PERSONAL LAB</text><text x="1154" y="38" font-size="13" fill="#5b6576" font-weight="400" text-anchor="end" class="mono">ENGINEERING × CURIOSITY × PLAY</text><text x="49" y="155" font-size="23" fill="#5b6576" font-weight="400" >Hello, world. I&#x27;m</text><text x="43" y="266" font-size="116" fill="#202c3d" font-weight="750" letter-spacing="-6">Saurav.</text><text x="51" y="334" font-size="42" fill="#202c3d" font-weight="600" letter-spacing="-1">Serious systems.</text><text x="51" y="387" font-size="42" fill="#087c69" font-weight="600" letter-spacing="-1">Playful possibilities.</text><text x="52" y="440" font-size="18" fill="#5b6576" font-weight="400" >Biomedical engineer · Indie hacker · Game dev enthusiast</text><text x="51" y="516" font-size="14" fill="#5b6576" font-weight="400" class="mono" letter-spacing="1">BASED IN THE LAND OF ENCHANTMENT</text><text x="1152" y="516" font-size="14" fill="#5b6576" font-weight="400" text-anchor="end" class="mono">A LITTLE SCIENCE. A LITTLE SIDE QUEST.</text><rect x="700" y="78" width="458" height="382" rx="18" fill="#fffdf8" stroke="#d6d5cf"/>
